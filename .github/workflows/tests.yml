name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

defaults:
  run:
    # The Python project lives in the mecapy/ subdirectory of this repo.
    working-directory: mecapy

jobs:
  test:
    # Pinned to 22.04: the ubuntu-latest image no longer provides Python 3.8,
    # which setup.py still declares as the minimum supported version.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        flake8 mecapy tests --max-line-length=100 --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 mecapy tests --max-line-length=100 --count --exit-zero --statistics

    - name: Run tests with pytest
      run: |
        pytest --cov=mecapy --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./mecapy/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
